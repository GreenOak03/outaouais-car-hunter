name: Outaouais Car Deal Hunter

on:
  schedule:
    # Runs every 6 hours to catch underpriced Gatineau/Ottawa listings early
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run Outaouais Car Scraper & TCO Evaluator
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python car_hunter.py

      - name: Commit updated deals & seen history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update Outaouais car deals [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
